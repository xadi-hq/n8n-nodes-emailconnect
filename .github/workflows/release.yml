name: Release

# Publishes to npm with provenance when a GitHub Release is published.
# Bump the version in package.json, then create a release:
#   gh release create v<version> --generate-notes
#
# One-time setup (no NPM_TOKEN needed):
#   npmjs.com -> package settings -> Publishing access -> Trusted Publisher
#   -> add this repo + workflow file "release.yml".
# Trusted publishing attaches npm provenance automatically, which is required
# for n8n community-node verification.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing + provenance require npm >= 11.5.1 (newer than what Node 22 ships).
      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
