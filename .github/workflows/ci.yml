name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # The rules n8n's community-package scanner enforces for verification.
      - name: Lint (n8n scanner rules)
        run: npm run lint:n8n

      # Build must run before tests: the test suite loads the compiled nodes from dist/.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test
